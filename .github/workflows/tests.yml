name: Tests

# Runs the Laravel test suite on every push, to any branch, and on pull
# requests. It deploys nothing and never touches a server: it only says
# whether the commit is green. Promote staging -> prod (ticket T7) will
# refuse a revision whose run here is not green.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laravel-app
    # Production runs PHP 8.4 and MySQL on server 6, so the suite does too,
    # on a throwaway MySQL that lives only for this run; no real data is
    # involved. SQLite is not used: its index names are global, MySQL's are
    # per table, and the migrations rely on MySQL's rule.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: bms_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bms_ci
      DB_USERNAME: root
      DB_PASSWORD: ci
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, curl, intl, bcmath, gd, zip, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('laravel-app/composer.lock') }}
          restore-keys: composer-

      - name: Environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: App key and database
        run: |
          php artisan key:generate --force
          php artisan migrate --force --no-interaction

      - name: Run the suite
        run: vendor/bin/phpunit --colors=always
