name: Console deploy (status-bms.cm-ea.com)

# Installs or updates the BMS console on server 6 (ticket T9):
# deploy/console/install.sh with the scripts from deploy/server/.
# Start it by pushing a tag named console-deploy-<anything>.

on:
  push:
    tags:
      - "console-deploy-*"

concurrency:
  group: console-deploy
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Upload deploy/ to server 6
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: deploy/console,deploy/server
          target: /tmp/bms-console-install/${{ github.run_id }}
          strip_components: 1

      - name: Install on server 6
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            D=/tmp/bms-console-install/${{ github.run_id }}
            bash "$D/console/install.sh" "$D"
            rc=$?
            rm -rf "$D"
            exit $rc

      - name: Check from the internet
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://status-bms.cm-ea.com/login || echo 000)
          echo "https://status-bms.cm-ea.com/login -> HTTP $code (through Cloudflare)"
          test "$code" = "200"
