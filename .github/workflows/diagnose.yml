name: Diagnose
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /var/www/eams/laravel-app
            echo "==== laravel.log: every error line today ===="
            grep -E "^\[2026-04-28.*ERROR" storage/logs/laravel.log 2>/dev/null | tail -40 || echo "no matches"
            echo ""
            echo "==== last 10 ERROR lines (any date) ===="
            grep "ERROR" storage/logs/laravel.log 2>/dev/null | tail -10
            echo ""
            echo "==== apache HTTP php settings ===="
            grep -E "^memory_limit|^max_execution_time" /etc/php/*/apache2/php.ini 2>/dev/null
            echo ""
            echo "==== ServerSignature / ErrorDocument in vhost ===="
            grep -iE "ErrorDocument|ServerSignature|ProxyTimeout" /etc/apache2/sites-enabled/*.conf 2>/dev/null
            echo ""
            echo "==== file mtime check (deployed code) ===="
            ls -la app/Http/Controllers/GLQualityController.php app/Odoo/Json2Client.php
            echo ""
            echo "==== controller has try/catch? ===="
            grep -c "catch" app/Http/Controllers/GLQualityController.php
