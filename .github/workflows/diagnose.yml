name: Diagnose
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /var/www/eams/laravel-app
            echo "==== laravel.log: GL Quality / FATAL / 500 ===="
            grep -iE "gl.quality|general.ledger|fatal|out.of.memory|allowed memory|Exception|Maximum execution" storage/logs/laravel.log 2>/dev/null | tail -40 || echo "no matches"
            echo ""
            echo "==== apache2 error.log (last 20) ===="
            tail -20 /var/log/apache2/error.log 2>/dev/null || true
            echo ""
            echo "==== HTTP php settings (NOT cli) ===="
            php -r 'phpinfo();' 2>/dev/null | grep -E "^memory_limit|^max_execution_time|^max_input_time" | head -10
            echo ""
            echo "==== apache2.conf timeout settings ===="
            grep -iE "Timeout|FastCgi" /etc/apache2/apache2.conf 2>/dev/null | head -5 || true
            echo ""
            echo "==== mod_php / php-fpm? ===="
            apache2ctl -M 2>/dev/null | grep -iE "php|fcgi|proxy_fcgi" || true
            echo ""
            echo "==== php-fpm pool conf ===="
            ls /etc/php/*/fpm/pool.d/ 2>/dev/null || echo "no fpm"
            grep -iE "request_terminate_timeout|memory_limit|max_execution" /etc/php/*/fpm/pool.d/www.conf /etc/php/*/apache2/php.ini 2>/dev/null | head
