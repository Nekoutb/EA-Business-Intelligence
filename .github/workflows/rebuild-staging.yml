name: Rebuild staging from production

# Replaces staging's database with a copy of production's as it is now,
# then neutralises it (client keys blanked, clients pointed at the shared
# copy, sessions/jobs emptied; mail already goes to the log and staging
# has no cron). Production's database is only read. Anything entered in
# staging since the last rebuild is lost.
#
# Two ways to start it:
#   - the "Run workflow" button (GitHub only offers it once this file is
#     on the default branch, i.e. after the cutover, ticket T8);
#   - pushing a tag named rebuild-staging-<anything>, e.g.
#       git tag rebuild-staging-2026-11-24 && git push origin rebuild-staging-2026-11-24
#
# Server side: deploy/server/bms-rebuild-staging.sh.

on:
  workflow_dispatch:
  push:
    tags:
      - "rebuild-staging-*"

concurrency:
  group: deploy-staging        # never at the same time as a staging deploy
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild staging-bms.cm-ea.com from production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: staging
      url: https://staging-bms.cm-ea.com
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Upload the scripts to server 6
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: deploy/server/bms-rebuild-staging.sh,deploy/server/prod-guard.sh
          target: /tmp/bms-rebuild/${{ github.run_id }}
          strip_components: 2

      - name: Rebuild on server 6
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 50m
          script: |
            D=/tmp/bms-rebuild/${{ github.run_id }}
            bash "$D/bms-rebuild-staging.sh"
            rc=$?
            rm -rf "$D"
            exit $rc

      - name: Check from the internet
        run: |
          code=$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 30 https://staging-bms.cm-ea.com/ || echo 000)
          echo "https://staging-bms.cm-ea.com/ (following redirects) -> HTTP $code (through Cloudflare)"
          test "$code" = "200"
