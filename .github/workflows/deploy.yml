name: Deploy to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  DOMAIN: bms.cm-ea.com
  REPO_DIR: /var/www/eams
  APP_SUBDIR: laravel-app
  ADMIN_EMAIL: admin@cm-ea.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Check out the repo on the runner. Uses the built-in GITHUB_TOKEN, so
      # private repos work without us having to put a PAT or deploy key on the
      # server. The server never talks to GitHub directly — we ship code over
      # SSH below.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Skip _archive/ via post-checkout cleanup; it's huge and unused.
          fetch-depth: 1

      - name: Strip files we don't ship to production
        run: |
          rm -rf _archive .github
          ls -la

      - name: Ensure target directory exists on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            mkdir -p ${{ env.REPO_DIR }}

      - name: Upload source to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "."
          target: ${{ env.REPO_DIR }}
          # rm:true would wipe /var/www/eams between deploys, blowing away the
          # .env (which holds APP_KEY). We let scp overwrite changed files and
          # leave anything else alone.
          rm: false
          overwrite: true

      - name: Provision & deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            DOMAIN="${{ env.DOMAIN }}"
            REPO_DIR="${{ env.REPO_DIR }}"
            APP_DIR="${{ env.REPO_DIR }}/${{ env.APP_SUBDIR }}"
            ADMIN_EMAIL="${{ env.ADMIN_EMAIL }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASS="${{ secrets.DB_PASSWORD }}"

            export DEBIAN_FRONTEND=noninteractive

            echo "🚀 Deploying $DOMAIN"
            echo "    Repo:    $REPO_DIR"
            echo "    Laravel: $APP_DIR"

            # ==================== INSTALL APACHE & PHP ====================
            echo "📦 Apache & PHP..."
            apt-get update -y
            if ! command -v apache2 >/dev/null; then
              apt-get install -y apache2 apache2-utils
              systemctl enable apache2
            fi
            if ! command -v php >/dev/null; then
              apt-get install -y libapache2-mod-php php php-cli php-mysql php-xml php-curl php-gd php-mbstring php-zip php-bcmath php-intl
            fi
            a2enmod rewrite ssl headers >/dev/null 2>&1 || true

            # ==================== INSTALL MYSQL ====================
            echo "🗄️  MySQL..."
            if ! command -v mysql >/dev/null; then
              apt-get install -y mysql-server
              systemctl start mysql
              systemctl enable mysql
            fi

            # ==================== DB & USER ====================
            echo "🔐 Database '$DB_NAME'..."
            mysql -u root -e "CREATE DATABASE IF NOT EXISTS \`$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            mysql -u root -e "CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';"
            mysql -u root -e "ALTER USER '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS';"
            mysql -u root -e "GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$DB_USER'@'localhost';"
            mysql -u root -e "FLUSH PRIVILEGES;"

            # ==================== COMPOSER & NODE ====================
            if ! command -v composer >/dev/null; then
              echo "📚 Composer..."
              apt-get install -y curl unzip
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            fi
            if ! command -v node >/dev/null; then
              echo "📦 Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            # We may have inherited a stray .git dir from an earlier deploy
            # attempt. Mark the path safe so composer/git stop complaining
            # about dubious ownership when running as root.
            git config --global --add safe.directory "$REPO_DIR" 2>/dev/null || true
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            cd "$APP_DIR"

            # ==================== COMPOSER INSTALL ====================
            echo "📚 PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # ==================== BUILD FRONTEND ASSETS ====================
            if [ -f package.json ]; then
              echo "🎨 Frontend (Vite)..."
              # Prefer 'npm ci' when a lock file is present (deterministic),
              # fall back to 'npm install' otherwise — the project doesn't yet
              # commit package-lock.json.
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              else
                npm install --no-audit --no-fund
              fi
              npm run build
            fi

            # ==================== ENV FILE (preserve APP_KEY) ====================
            echo "⚙️  .env..."
            EXISTING_APP_KEY=""
            if [ -f .env ]; then
              EXISTING_APP_KEY=$(grep -E '^APP_KEY=' .env | head -n1 | cut -d= -f2- || true)
            fi

            cat > .env << EOF
            APP_NAME=EAMS
            APP_ENV=production
            APP_KEY=$EXISTING_APP_KEY
            APP_DEBUG=false
            APP_URL=https://$DOMAIN
            APP_TIMEZONE=UTC

            LOG_CHANNEL=stack
            LOG_LEVEL=warning

            DB_CONNECTION=mysql
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=$DB_NAME
            DB_USERNAME=$DB_USER
            DB_PASSWORD=$DB_PASS

            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            CACHE_STORE=database
            QUEUE_CONNECTION=database

            BCRYPT_ROUNDS=12
            EOF

            if [ -z "$EXISTING_APP_KEY" ]; then
              echo "🔑 Generating APP_KEY..."
              php artisan key:generate --force
            fi

            # ==================== MIGRATIONS + SEED + CACHE ====================
            echo "🔄 Migrations..."
            php artisan migrate --force

            echo "👤 Seeding super admin + demo tenant (idempotent)..."
            # TenancySeeder uses firstOrCreate, so re-running is safe and
            # never duplicates rows. First-time deploys get:
            #   super admin: super@local / changeme
            #   demo tenant: owner@demo.local / changeme
            # The operator should change both passwords after first login.
            php artisan db:seed --force --no-interaction

            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # ==================== PERMISSIONS ====================
            echo "🔒 Permissions..."
            chown -R www-data:www-data "$REPO_DIR"
            find "$REPO_DIR" -type d -exec chmod 755 {} \;
            find "$REPO_DIR" -type f -exec chmod 644 {} \;
            chmod -R 775 "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"

            # ==================== APACHE VHOST (HTTP) ====================
            echo "🌐 Apache vhost..."
            cat > /etc/apache2/sites-available/$DOMAIN.conf << EOF
            <VirtualHost *:80>
                ServerName $DOMAIN
                ServerAlias www.$DOMAIN
                DocumentRoot $APP_DIR/public

                <Directory $APP_DIR/public>
                    Options FollowSymLinks
                    AllowOverride All
                    Require all granted
                </Directory>

                ErrorLog  \${APACHE_LOG_DIR}/${DOMAIN}_error.log
                CustomLog \${APACHE_LOG_DIR}/${DOMAIN}_access.log combined
            </VirtualHost>
            EOF

            a2dissite 000-default.conf >/dev/null 2>&1 || true
            a2ensite $DOMAIN.conf >/dev/null
            apache2ctl configtest
            systemctl reload apache2

            # ==================== FIREWALL (ufw) ====================
            # Open the web ports BEFORE certbot so the HTTP-01 challenge can
            # actually reach Apache. Allow SSH first to avoid locking ourselves
            # out of the running session when ufw transitions to enabled.
            echo "🔥 Configuring firewall (ufw)..."
            if ! command -v ufw >/dev/null; then
              apt-get install -y ufw
            fi
            ufw allow 22/tcp   >/dev/null
            ufw allow 80/tcp   >/dev/null
            ufw allow 443/tcp  >/dev/null
            # --force avoids the interactive y/N prompt; existing SSH session
            # is preserved, only NEW connections are filtered against rules.
            ufw --force enable >/dev/null
            ufw status verbose | head -20

            # ==================== LET'S ENCRYPT ====================
            echo "🔒 Let's Encrypt..."
            if ! command -v certbot >/dev/null; then
              apt-get install -y certbot python3-certbot-apache
            fi

            if [ ! -d /etc/letsencrypt/live/$DOMAIN ]; then
              echo "    Requesting cert for $DOMAIN..."
              certbot --apache --non-interactive --agree-tos --redirect \
                --email "$ADMIN_EMAIL" -d "$DOMAIN" -d "www.$DOMAIN" || \
                echo "⚠️  Certbot failed (DNS not pointing here yet?). HTTP deployment still active."
            else
              echo "    Cert exists — running renew check."
              certbot renew --quiet --no-self-upgrade || true
            fi

            systemctl reload apache2

            # ==================== INTERNAL HEALTH CHECK ====================
            # Quick sanity check from inside the box — does Apache answer locally?
            echo "🩺 Local health check..."
            sleep 2
            LOCAL_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: $DOMAIN" "http://127.0.0.1" || echo "000")
            echo "    Local HTTP $LOCAL_CODE"
            if [ "$LOCAL_CODE" = "000" ]; then
              echo "❌ Apache is not responding on localhost — deployment failed."
              exit 1
            fi

            # Mark whether HTTPS is meant to be live so the runner-side check
            # knows whether to require port 443.
            if [ -d "/etc/letsencrypt/live/$DOMAIN" ]; then
              echo "https" > /tmp/eams_deploy_scheme
            else
              echo "http" > /tmp/eams_deploy_scheme
            fi

            echo ""
            echo "✅ Server-side deployment completed."
            echo "🌐 App URL:   https://$DOMAIN  (or http:// before DNS/cert is in place)"
            echo "📊 Database:  $DB_NAME"
            echo "📁 App path:  $APP_DIR"

      # =========================================================================
      # External reachability test — run from the GitHub Actions runner so we
      # validate the public network path (DNS + cloud firewall + ufw + Apache).
      # The deployment is only deemed successful if port 80 is reachable AND
      # the domain serves a non-zero HTTP response.
      # =========================================================================
      - name: Verify external reachability
        env:
          DOMAIN: ${{ env.DOMAIN }}
          IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e

          echo "==> TCP connect to $IP:80 (mandatory)"
          if ! timeout 10 bash -c "</dev/tcp/$IP/80" 2>/dev/null; then
            echo "❌ Port 80 NOT reachable on $IP from the public internet."
            echo "   ufw is configured on the server, so the block is upstream."
            echo "   → Check your cloud provider firewall (Vultr/DO/AWS panel)."
            exit 1
          fi
          echo "✅ Port 80 reachable on $IP."

          echo "==> HTTP request to http://$DOMAIN (mandatory)"
          HTTP_CODE=$(curl -skL -o /dev/null -w "%{http_code}" \
            --max-time 15 --connect-timeout 5 "http://$DOMAIN" || echo "000")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ http://$DOMAIN returned no response."
            echo "   DNS may not point to $IP yet, or the path is blocked between"
            echo "   the resolver and the server."
            exit 1
          fi
          # Laravel returns 4xx/5xx is fine — what matters is *something* answered.
          echo "✅ http://$DOMAIN → HTTP $HTTP_CODE."

          echo "==> TCP connect to $IP:443 (best-effort)"
          if timeout 10 bash -c "</dev/tcp/$IP/443" 2>/dev/null; then
            echo "✅ Port 443 reachable on $IP."
            HTTPS_CODE=$(curl -skL -o /dev/null -w "%{http_code}" \
              --max-time 15 --connect-timeout 5 "https://$DOMAIN" || echo "000")
            echo "    https://$DOMAIN → HTTP $HTTPS_CODE."
          else
            echo "⚠️  Port 443 not reachable yet — Let's Encrypt cert was likely"
            echo "   skipped on this run (DNS or firewall). Re-run this workflow"
            echo "   once http:// is propagated and certbot will issue the cert."
          fi

          echo ""
          echo "✅ External reachability check passed."
